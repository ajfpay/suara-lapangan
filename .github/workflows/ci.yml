name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suara
          POSTGRES_PASSWORD: suara
          POSTGRES_DB: suara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suara -d suara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://suara:suara@localhost:5432/suara_test
      PDF_STORAGE_DIR: /home/runner/work/suara-lapangan/suara-lapangan/data/pdf-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The schema and fixture contract checker. Nothing ran it before, so a
      # schema change could leave it red unnoticed.
      - name: Contract tests
        run: npm run test:contracts

      # Only Chromium: both Playwright projects use it, so pulling Firefox and
      # WebKit would add minutes per run for browsers nothing here targets.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The e2e suite seeds its session and asserts rows in a real Postgres,
      # so the schema must exist before the app boots.
      - name: Migrate test database
        run: node db/migrate.mjs

      # Builds and serves the production bundle (see playwright.config.ts).
      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
